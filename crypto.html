<!DOCTYPE html>
<html>
<head>
  <title>Crypto</title>
  <script src="timer.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>
<body>
  <h2>Pesan Rahasia</h2>
  <div id="timer"></div>

  <p style="font-size: 22px;">
    ijnbujlb_vuz
  </p>

  <p><b>Hint:</b> Caesar Cipher (-1)</p>
  <br>
  <input
    id="flagInput"
    placeholder="Masukkan flag di sini"
    style="padding:10px; width:300px;"
  >
  <br><br>

    <button id="submitBtn" onclick="submitFlag('flag{himatika_uty}')">
    Submit Flag
  </button>

  <script>
  let solved = false;

  function submitFlag(correctFlag) {
    if (solved) return;

    const inputEl = document.getElementById("flagInput");
    const buttonEl = document.getElementById("submitBtn");
    const input = inputEl.value.trim();

    if (input === correctFlag) {
      solved = true;

      stopTimer();

      confetti({
        particleCount: 180,
        spread: 90,
        origin: { y: 0.6 }
      });

      const audio = new Audio("sfx/success.mp3");
      audio.play().catch(() => {});

      inputEl.readOnly = true;
      buttonEl.disabled = true;
      buttonEl.innerText = "✅ Completed";

      alert("🎉 Flag benar! Challenge selesai 🎉");
    } else {
      alert("❌ Flag salah, coba lagi");
    }
  }
</script>


</body>
</html>
