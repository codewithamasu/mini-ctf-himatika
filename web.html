<!DOCTYPE html>
<html>
<head>
  <title>Admin Login</title>
  <script src="timer.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>
<body>
  <h2>Admin Login</h2>
  <div id="timer"></div>

  <input placeholder="username"><br><br>
  <input type="password" placeholder="password"><br><br>
  <button>Login</button>

  <p><b>Hint:</b> Lihat halaman ini lebih dalam.</p>

  <!-- 
    flag{
      himatika_uty_web_inspect
    }
  -->
    <input
    id="flagInput"
    placeholder="Masukkan flag di sini"
    style="padding:10px; width:300px;"
  >
  <br><br>

    <button id="submitBtn" onclick="submitFlag('flag{himatika_uty_web_inspect}')">
    Submit Flag
  </button>


  <script>
  let solved = false;

  function submitFlag(correctFlag) {
    if (solved) return;

    const inputEl = document.getElementById("flagInput");
    const buttonEl = document.getElementById("submitBtn");
    const input = inputEl.value.trim();

    if (input === correctFlag) {
      solved = true;

      stopTimer();

      confetti({
        particleCount: 180,
        spread: 90,
        origin: { y: 0.6 }
      });

      const audio = new Audio("sfx/success.mp3");
      audio.play().catch(() => {});

      inputEl.readOnly = true;
      buttonEl.disabled = true;
      buttonEl.innerText = "✅ Completed";

      alert("🎉 Flag benar! Challenge selesai 🎉");
    } else {
      alert("❌ Flag salah, coba lagi");
    }
  }
</script>

</body>
</html>
